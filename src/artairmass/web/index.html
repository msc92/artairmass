<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>artairmass</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint (no flash of the wrong theme at the telescope).
    try { const t = localStorage.getItem("artairmass.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="vendor/plotly.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app"><div class="boot">artairmass</div></div>
</body>
</html>
