[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artairmass"
version = "0.1.0"
description = "Offline-first observation planner: airmass, almanac, sky display and observability (a modern JSkyCalc)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Michael Calzadilla" }]
keywords = ["astronomy", "observing", "airmass", "observation planning", "jskycalc", "astropy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=6.1",
    "astropy-iers-data",
    "numpy>=1.24",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "platformdirs>=3",
    "tzdata",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/msc92/artairmass"
Issues = "https://github.com/msc92/artairmass/issues"
Validation = "https://github.com/msc92/artairmass/blob/main/validation/VALIDATION.md"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "astroplan>=0.10", "playwright>=1.45", "pyflakes", "pillow"]

[project.scripts]
artairmass = "artairmass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artairmass = ["data/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::astropy.utils.exceptions.AstropyWarning"]
